name: Windows Installer

# Builds Hck NSIS (+ MSI) installers on windows-latest (Phase 9 packaging).
# Triggers: push to main (paths), tags v*, workflow_dispatch.
# Release: on v* tags or workflow_dispatch with create_release=true.

on:
  push:
    branches:
      - main
      - "cursor/windows-exe-build-4197"
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      create_release:
        description: "Create/update GitHub Release (tag from package version, e.g. v0.9.0)"
        type: boolean
        default: true
      bundles:
        description: "Tauri bundles to build"
        type: choice
        options:
          - nsis,msi
          - nsis
          - msi
        default: nsis,msi

permissions:
  contents: write

concurrency:
  group: windows-installer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build NSIS/MSI
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Resolve bundles
        id: meta
        shell: bash
        run: |
          BUNDLES="${{ github.event.inputs.bundles || 'nsis,msi' }}"
          ARGS=""
          IFS=',' read -ra PARTS <<< "$BUNDLES"
          for b in "${PARTS[@]}"; do
            b="$(echo "$b" | xargs)"
            [[ -z "$b" ]] && continue
            ARGS="$ARGS --bundles $b"
          done
          echo "args=${ARGS}" >> "$GITHUB_OUTPUT"
          echo "bundles=${BUNDLES}" >> "$GITHUB_OUTPUT"

          CREATE=false
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            CREATE=true
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ github.event.inputs.create_release }}" == "true" ]]; then
            CREATE=true
          fi
          # Never publish releases from pull_request builds
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            CREATE=false
          fi
          echo "create_release=${CREATE}" >> "$GITHUB_OUTPUT"
          VERSION=$(node -p "require('./apps/desktop/package.json').version")
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "Resolved: bundles=$BUNDLES create_release=$CREATE version=$VERSION"

      - name: Install WiX Toolset v3 (MSI)
        if: contains(steps.meta.outputs.bundles, 'msi')
        shell: pwsh
        run: |
          choco install wixtoolset --version=3.14.1 -y --no-progress
          $candidates = @(
            "C:\Program Files (x86)\WiX Toolset v3.14\bin",
            "C:\Program Files (x86)\WiX Toolset v3.11\bin"
          )
          $found = $candidates | Where-Object { Test-Path (Join-Path $_ "candle.exe") } | Select-Object -First 1
          if (-not $found) {
            $found = Get-ChildItem "C:\Program Files (x86)\WiX Toolset*\bin\candle.exe" -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty DirectoryName
          }
          if (-not $found) { throw "WiX candle.exe nicht gefunden" }
          echo $found | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "WiX PATH += $found"
          & (Join-Path $found "candle.exe") -?

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Typecheck
        working-directory: apps/desktop
        run: npm run typecheck

      - name: Build installers (no release)
        if: steps.meta.outputs.create_release != 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: ${{ steps.meta.outputs.args }}

      - name: Build installers and publish release
        if: steps.meta.outputs.create_release == 'true'
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/desktop
          args: ${{ steps.meta.outputs.args }}
          tagName: v__VERSION__
          releaseName: Hck v__VERSION__
          releaseBody: |
            Windows-Installer für die Hck-Plattform (Phase 9 Packaging).

            ## Download
            - **NSIS:** `Hck_*_x64-setup.exe` — empfohlen
            - **MSI:** WiX-Installer — für Unternehmens-Deployment

            ## Nach der Installation
            1. Python **3.11+** von https://www.python.org/downloads/ installieren („Add to PATH“).
            2. `setup-backend.ps1` aus den Release-Assets ausführen:
               `.\setup-backend.ps1 -Portable`
               → venv unter `%LOCALAPPDATA%\com.hck.platform\python-venv`.
            3. Hck starten. Log: `%LOCALAPPDATA%\com.hck.platform\backend.log`

            Siehe auch `windows-packaging.md` in den Assets.
          releaseDraft: false
          prerelease: false

      - name: List bundle outputs
        shell: pwsh
        run: |
          $root = "apps/desktop/src-tauri/target/release/bundle"
          Get-ChildItem -Recurse $root -Include *.exe,*.msi -ErrorAction SilentlyContinue |
            ForEach-Object { Write-Host "$($_.Length) $($_.FullName)" }

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: hck-windows-installers-${{ steps.meta.outputs.version }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
            apps/desktop/src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 30

      - name: Upload setup scripts artifact
        uses: actions/upload-artifact@v4
        with:
          name: hck-windows-setup-scripts
          path: |
            scripts/windows/setup-backend.ps1
            scripts/windows/smoke-check.ps1
            docs/windows-packaging.md
          if-no-files-found: error
          retention-days: 30

      - name: Attach setup scripts to GitHub Release
        if: steps.meta.outputs.create_release == 'true'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="v${{ steps.meta.outputs.version }}"
          for i in 1 2 3 4 5 6; do
            if gh release view "$TAG" --repo "${{ github.repository }}" >/dev/null 2>&1; then
              break
            fi
            echo "Waiting for release $TAG…"
            sleep 5
          done
          gh release upload "$TAG" \
            scripts/windows/setup-backend.ps1 \
            scripts/windows/smoke-check.ps1 \
            docs/windows-packaging.md \
            --repo "${{ github.repository }}" \
            --clobber
